name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: abidjan4all
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/abidjan4all?schema=public
      AUTH_SECRET: ci-secret-not-for-production
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Client Prisma + migrations + seed
        run: |
          pnpm --filter @a4a/db exec prisma generate
          pnpm --filter @a4a/db exec prisma migrate deploy
          pnpm --filter @a4a/db exec prisma db seed

      - name: Type-check (tous les packages)
        run: pnpm lint

      - name: Build de production
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Image Docker (sans push — le registre viendra avec le VPS)
        run: docker build -f apps/web/Dockerfile -t abidjan4all-web:ci .
