# Production Abidjan4All — VPS IONOS (docker compose v2)
#   cp .env.example .env   # à la racine du repo, renseigner les secrets
#   docker compose -f infra/docker/docker-compose.prod.yml up -d --build
# TLS/CDN : Cloudflare ou reverse-proxy (caddy/traefik) devant le port 3000.

services:
  # TLS automatique (Let's Encrypt) + proxy vers le web.
  caddy:
    image: caddy:2
    restart: unless-stopped
    # Caddy est le SEUL point d entree public. Pour servir Activepieces sur
    # automation.abidjan4all.info, il doit pouvoir joindre son conteneur : on
    # le rattache au reseau d Activepieces, en plus du sien. Aucun port
    # supplementaire n est ouvert — Activepieces reste invisible de l internet,
    # seul Caddy y accede, par ce reseau.
    networks:
      - default
      - activepieces
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - a4a_caddy_data:/data
      - a4a_caddy_config:/config
      - a4a_caddy_logs:/var/log/caddy # journal d'accès (sans IP) — survit aux redéploiements
    depends_on:
      - web

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        # Inlinés dans le bundle client au build (voir Dockerfile).
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        NEXT_PUBLIC_GA4_ID: ${NEXT_PUBLIC_GA4_ID:-}
    restart: unless-stopped
    # Aucun port publié : l'application n'est jointe que par Caddy, sur le
    # réseau interne de Docker. Le port 3000 était exposé sur toutes les
    # interfaces et contournait donc le TLS. Il n'était pas joignable depuis
    # l'extérieur, mais grâce au pare-feu de l'hébergeur seulement — une
    # protection qu'on ne maîtrise pas. Docker publie d'ailleurs ses ports en
    # écrivant directement dans iptables, au-dessus d'ufw : un pare-feu local
    # n'y aurait rien changé.
    #
    # Pour joindre l'application en débogage : tunnel SSH (cf. Caddyfile).
    env_file: ../../.env
    volumes:
      - a4a_uploads:/data/uploads # médiathèque : survit aux redéploiements
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  # une passe : applique les migrations Prisma puis s'arrête
  migrate:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: builder
    command: pnpm --filter @a4a/db exec prisma migrate deploy
    env_file: ../../.env
    depends_on:
      postgres:
        condition: service_healthy

  # Tâches de fond : publication des articles programmés, relances d'échéance
  # d'abonnement, rapports annonceurs mensuels.
  #
  # Elles tournaient dans le serveur web, démarrées par instrumentation.ts.
  # Chaque instance web tenait donc son propre planificateur : passer à deux
  # instances aurait envoyé deux relances à chaque abonné et publié deux fois
  # les articles programmés.
  #
  # UNE SEULE RÉPLIQUE, toujours. C'est la garantie de non-duplication, et
  # elle suffit parce que les trois tâches sont déjà idempotentes. Ajouter des
  # répliques imposerait d'abord un verrou dans scripts/planificateur.ts.
  #
  # `working_dir` place le processus dans apps/web pour que tsx trouve le
  # tsconfig qui résout les alias `@/` — sans lui, les imports échouent.
  scheduler:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: builder
    working_dir: /app/apps/web
    command: pnpm exec tsx scripts/planificateur.ts
    restart: unless-stopped
    env_file: ../../.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-abidjan4all}
    volumes:
      - a4a_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-abidjan4all}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - a4a_redisdata_prod:/data

volumes:
  a4a_pgdata_prod:
  a4a_redisdata_prod:
  a4a_caddy_data:
  a4a_caddy_config:
  a4a_caddy_logs:
  a4a_uploads:

networks:
  default:
  activepieces:
    external: true
    name: activepieces_activepieces
